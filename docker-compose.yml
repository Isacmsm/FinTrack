services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Sem isso o container roda em UTC e DateTime.Today/Now ficam 3h à
      # frente do horário de Brasília: entre 21h e a meia-noite o app já
      # considera que é o dia seguinte, e no último dia do mês o dashboard e
      # os filtros de Transações/Orçamento viram pro mês novo antes da hora.
      # Instante gravado continua sendo UTC (DateTime.UtcNow) e é convertido
      # na exibição por Data/Fuso.cs.
      TZ: America/Sao_Paulo
      ConnectionStrings__FinTrack: "Server=sqlserver;Database=FinTrack;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      # Bootstrap do primeiro Operador (login do painel /admin) — só roda
      # uma vez, quando a tabela Operador ainda está vazia (ver Program.cs).
      Admin__Email: "${ADMIN_EMAIL}"
      Admin__SenhaInicial: "${ADMIN_SENHA_INICIAL}"
    volumes:
      - appkeys:/app/keys
      # Mesmo motivo do appkeys: sem volume nomeado, os logs em disco (com
      # retenção de 15 dias) somem a cada "docker compose build app && up".
      - applogs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sqldata:
  appkeys:
  applogs:
  caddy_data:
  caddy_config:
